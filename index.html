<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mooney Fleet Map — FAA Registry</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:#0d1117;color:#e6edf3}
#map{position:absolute;inset:0;z-index:0}

/* ── HEADER ── */
#hdr{
  position:absolute;top:0;left:0;right:0;z-index:500;
  background:rgba(13,17,23,0.96);border-bottom:2px solid #c8102e;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:center;padding:0 10px;height:52px;gap:8px;
}
#hdr h1{font-size:.9em;font-weight:700;color:#fff;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hdr h1 em{color:#c8102e;font-style:normal}
#hdr-stats{font-size:.6em;color:#8b949e;white-space:nowrap;display:none}
@media(min-width:680px){#hdr-stats{display:block}#hdr h1{flex:none}}

.hbtn{
  background:#21262d;border:1px solid #30363d;color:#e6edf3;
  border-radius:8px;padding:0 12px;height:36px;min-width:36px;
  font-size:.78em;cursor:pointer;font-weight:600;white-space:nowrap;
  flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:4px;
}
.hbtn:active{background:#30363d}
.hbtn.active{background:#c8102e;border-color:#c8102e;color:#fff}

/* ── BADGE ── */
#badge{
  position:absolute;top:60px;left:50%;transform:translateX(-50%);
  background:rgba(13,17,23,0.9);border:1px solid #30363d;
  border-radius:20px;padding:4px 14px;font-size:.7em;color:#8b949e;
  z-index:400;pointer-events:none;white-space:nowrap;display:none;
}
#badge b{color:#c8102e}

/* ── BACKDROP ── */
#backdrop{
  position:absolute;inset:0;z-index:550;
  background:rgba(0,0,0,0.5);display:none;
}
#backdrop.show{display:block}

/* ── BOTTOM SHEET base ── */
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:600;
  background:rgba(18,22,30,0.98);
  border-top:1px solid #30363d;border-radius:18px 18px 0 0;
  padding:0 0 max(20px,env(safe-area-inset-bottom)) 0;
  transform:translateY(101%);
  transition:transform 0.3s cubic-bezier(0.32,0.72,0,1);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  max-height:85vh;overflow-y:auto;
}
.sheet.open{transform:translateY(0)}
.sheet-handle{
  width:36px;height:4px;background:#30363d;border-radius:4px;
  margin:12px auto 0;
}
.sheet-title{
  font-size:.78em;font-weight:700;color:#8b949e;
  text-transform:uppercase;letter-spacing:.7px;
  padding:10px 16px 4px;
}

/* desktop: filter panel as dropdown, legend as sidebar */
@media(min-width:680px){
  #filter-sheet{
    top:52px;bottom:auto;left:auto;right:0;border-radius:0 0 12px 12px;
    border:1px solid #30363d;border-top:none;width:300px;
    max-height:80vh;transform:translateY(-105%);
  }
  #filter-sheet.open{transform:translateY(0)}
  #legend-sheet{
    bottom:20px;left:auto;right:10px;border-radius:10px;
    border:1px solid #30363d;border-top:1px solid #30363d;width:170px;
    max-height:65vh;padding-bottom:10px;transform:translateX(115%);
  }
  #legend-sheet.open{transform:translateX(0)}
  .sheet-handle{display:none}
}

/* ── FILTER SHEET CONTENTS ── */
.frow{display:flex;flex-direction:column;gap:5px;padding:10px 16px}
.frow label{font-size:.72em;color:#8b949e;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.finput{
  background:#161b22;border:1px solid #30363d;color:#e6edf3;
  border-radius:9px;padding:11px 12px;font-size:1em;
  width:100%;outline:none;-webkit-appearance:none;appearance:none;
}
.finput:focus{border-color:#c8102e}
@media(min-width:680px){.finput{font-size:.84em;padding:7px 10px}}
.factions{display:flex;gap:8px;padding:12px 16px 4px}
.fbtn{
  flex:1;height:46px;border-radius:10px;font-size:.88em;
  font-weight:600;cursor:pointer;border:none;
}
@media(min-width:680px){.fbtn{height:36px;font-size:.78em}}
.fbtn.primary{background:#c8102e;color:#fff}
.fbtn.primary:active{background:#a00d24}
.fbtn.secondary{background:#21262d;color:#e6edf3;border:1px solid #30363d}
.fbtn.secondary:active{background:#30363d}

/* ── LEGEND SHEET CONTENTS ── */
.li{
  display:flex;align-items:center;gap:8px;
  padding:8px 16px;cursor:pointer;min-height:44px;
}
.li:active{background:rgba(200,16,46,.1)}
@media(min-width:680px){.li{padding:4px 8px;min-height:auto}}
.li.off{opacity:.28}
.dot{width:13px;height:13px;border-radius:50%;flex-shrink:0;border:1.5px solid rgba(255,255,255,.25)}
.ll{font-size:.8em;flex:1}
.lc{font-size:.68em;color:#8b949e}
@media(min-width:680px){.ll{font-size:.73em}.lc{font-size:.63em}}

/* ── SPLASH ── */
#splash{
  position:absolute;inset:0;z-index:2000;background:rgba(10,14,20,.97);
  display:flex;align-items:center;justify-content:center;
}
.sp-card{
  background:#161b22;border:1px solid #30363d;border-radius:14px;
  padding:28px 24px;max-width:340px;width:86%;text-align:center;
}
.sp-card h2{font-size:1.1em;color:#fff;margin-bottom:8px}
.sp-card p{font-size:.82em;color:#8b949e;line-height:1.65}
.spinner{
  width:40px;height:40px;border:3px solid #30363d;border-top-color:#c8102e;
  border-radius:50%;animation:spin .8s linear infinite;margin:16px auto 0;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── POPUP ── */
.leaflet-popup-content-wrapper{
  background:#161b22!important;border:1px solid #c8102e!important;
  border-radius:10px!important;color:#e6edf3!important;
  box-shadow:0 6px 28px rgba(0,0,0,.65)!important;
}
.leaflet-popup-tip{background:#161b22!important}
.leaflet-popup-content{margin:12px 14px!important;min-width:200px;max-width:270px}
.pu-n{font-size:1.05em;font-weight:700;color:#c8102e;margin-bottom:2px}
.pu-m{font-size:.82em;font-weight:600;color:#58a6ff;margin-bottom:6px}
.pu-r{font-size:.78em;color:#c9d1d9;margin:3px 0;line-height:1.4}
.pu-r b{color:#fff}
.leaflet-popup-close-button{font-size:22px!important;padding:5px 8px!important;color:#8b949e!important}
.leaflet-control-zoom a{width:36px!important;height:36px!important;line-height:36px!important;font-size:18px!important}
.leaflet-control-attribution{font-size:.58em!important}
</style>
</head>
<body>

<div id="map"></div>

<!-- HEADER -->
<div id="hdr" style="display:none">
  <h1>&#9992; Mooney Fleet <em>FAA</em></h1>
  <span id="hdr-stats"></span>
  <button class="hbtn" id="btn-filter" onclick="toggleFilter()">&#9776; Filters</button>
  <button class="hbtn" id="btn-legend" onclick="toggleLegend()">&#11035; Legend</button>
</div>

<div id="badge"><b id="vis-n">—</b> shown</div>

<div id="backdrop" onclick="closeAll()"></div>

<!-- FILTER BOTTOM SHEET -->
<div class="sheet" id="filter-sheet">
  <div class="sheet-handle" onclick="closeAll()"></div>
  <div class="sheet-title">Filter Aircraft</div>
  <div class="frow">
    <label>Search N-number or Owner</label>
    <input class="finput" type="search" id="q" placeholder="e.g. N1234M or SMITH"
           autocorrect="off" autocapitalize="off" autocomplete="off" spellcheck="false"
           oninput="applyFilter()">
  </div>
  <div class="frow">
    <label>Model</label>
    <select class="finput" id="sel-m" onchange="applyFilter()">
      <option value="">All Models</option>
    </select>
  </div>
  <div class="frow">
    <label>State</label>
    <select class="finput" id="sel-s" onchange="applyFilter()">
      <option value="">All States</option>
    </select>
  </div>
  <div class="factions">
    <button class="fbtn primary" onclick="closeAll()">Done</button>
    <button class="fbtn secondary" onclick="resetAll()">Reset</button>
  </div>
</div>

<!-- LEGEND BOTTOM SHEET -->
<div class="sheet" id="legend-sheet">
  <div class="sheet-handle" onclick="closeAll()"></div>
  <div class="sheet-title">Model Legend &nbsp;<span style="color:#30363d;font-weight:400;text-transform:none;letter-spacing:0">tap to toggle</span></div>
  <div id="leg-items"></div>
</div>

<!-- SPLASH -->
<div id="splash">
  <div class="sp-card">
    <h2>Loading Mooney Fleet Map</h2>
    <p>Placing <b style="color:#fff">6,229 aircraft</b><br>across 26 Mooney models</p>
    <div class="spinner"></div>
  </div>
</div>

// ── Decompress ────────────────────────────────────────────────
async function decodeData(){
  const bin=atob(B64),arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  const ds=new DecompressionStream('gzip'),w=ds.writable.getWriter(),r=ds.readable.getReader();
  w.write(arr);w.close();
  const chunks=[];
  while(true){const o=await r.read();if(o.done)break;chunks.push(o.value);}
  const buf=new Uint8Array(chunks.reduce((s,c)=>s+c.length,0));let off=0;
  for(const c of chunks){buf.set(c,off);off+=c.length;}
  return JSON.parse(new TextDecoder().decode(buf));
}

// ── Icons ─────────────────────────────────────────────────────
function makeIcon(color,faded){
  if(faded) return L.divIcon({
    html:'<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10"><circle cx="5" cy="5" r="3.5" fill="'+color+'" stroke="rgba(255,255,255,0.2)" stroke-width="1" opacity="0.5"/></svg>',
    className:'',iconSize:[10,10],iconAnchor:[5,5],popupAnchor:[0,-6]
  });
  return L.divIcon({
    html:'<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"><circle cx="7" cy="7" r="5.5" fill="'+color+'" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/></svg>',
    className:'',iconSize:[14,14],iconAnchor:[7,7],popupAnchor:[0,-9]
  });
}

// ── Markers ───────────────────────────────────────────────────
function buildMarkers(recs){
  recs.forEach(r=>{
    const [n,m,o,city,state,zip,year,lat,lon,src]=r;
    const faded=(src==='state');
    const mk=L.marker([lat,lon],{icon:makeIcon(MODEL_COLOR[m]||'#888',faded)});
    const loc=[city,state].filter(Boolean).join(', ')||'—';
    const yr=year?'<div class="pu-r"><b>Year:</b> '+year+'</div>':'';
    const note=faded?'<div style="font-size:.62em;color:#fb8500;margin-top:5px">&#9888; City not found — placed at state center</div>':'';
    mk.bindPopup(
      '<div class="pu-n">'+n+'</div>'+
      '<div class="pu-m">'+m+'</div>'+
      '<div class="pu-r"><b>Owner:</b> '+(o||'Withheld / Unknown')+'</div>'+
      '<div class="pu-r"><b>Location:</b> '+loc+(zip?' '+zip:'')+'</div>'+yr+note,
      {maxWidth:280,autoPanPaddingTopLeft:L.point(10,62),autoPanPaddingBottomRight:L.point(10,10)}
    );
    mk._d={n,m,o,state};
    markers.push(mk);
  });
}

// ── Filter ────────────────────────────────────────────────────
let layerGroup;
function applyFilter(){
  if(layerGroup) layerGroup.remove();
  layerGroup=L.layerGroup();
  const q=document.getElementById('q').value.trim().toLowerCase();
  const sm=document.getElementById('sel-m').value;
  const ss=document.getElementById('sel-s').value;
  let vis=0;
  markers.forEach(mk=>{
    const d=mk._d;
    if(!hiddenModels.has(d.m)&&(!sm||d.m===sm)&&(!ss||d.state===ss)&&
       (!q||d.n.toLowerCase().includes(q)||d.o.toLowerCase().includes(q))){
      layerGroup.addLayer(mk);vis++;
    }
  });
  layerGroup.addTo(map);
  document.getElementById('vis-n').textContent=vis.toLocaleString();
  syncLegend();
  updateFilterHighlight();
}

function resetAll(){
  hiddenModels.clear();
  document.getElementById('q').value='';
  document.getElementById('sel-m').value='';
  document.getElementById('sel-s').value='';
  applyFilter();
}

// ── Sheet toggles ─────────────────────────────────────────────
function setBackdrop(show){
  document.getElementById('backdrop').classList.toggle('show',show);
}
function toggleFilter(){
  filterOpen=!filterOpen;
  if(filterOpen){legendOpen=false;document.getElementById('legend-sheet').classList.remove('open');document.getElementById('btn-legend').classList.remove('active');}
  document.getElementById('filter-sheet').classList.toggle('open',filterOpen);
  document.getElementById('btn-filter').classList.toggle('active',filterOpen);
  setBackdrop(filterOpen||legendOpen);
}
function toggleLegend(){
  legendOpen=!legendOpen;
  if(legendOpen){filterOpen=false;document.getElementById('filter-sheet').classList.remove('open');document.getElementById('btn-filter').classList.remove('active');}
  document.getElementById('legend-sheet').classList.toggle('open',legendOpen);
  document.getElementById('btn-legend').classList.toggle('active',legendOpen);
  setBackdrop(filterOpen||legendOpen);
}
function closeAll(){
  filterOpen=false;legendOpen=false;
  document.getElementById('filter-sheet').classList.remove('open');
  document.getElementById('legend-sheet').classList.remove('open');
  document.getElementById('btn-filter').classList.remove('active');
  document.getElementById('btn-legend').classList.remove('active');
  setBackdrop(false);
}
function updateFilterHighlight(){
  const active=document.getElementById('q').value||document.getElementById('sel-m').value||
               document.getElementById('sel-s').value||hiddenModels.size>0;
  if(!filterOpen) document.getElementById('btn-filter').classList.toggle('active',!!active);
}

    d.innerHTML='<div class="dot" style="background:'+l.color+'"></div>'+
      '<span class="ll">'+l.model+'</span><span class="lc">'+l.count.toLocaleString()+'</span>';
    d.onclick=()=>{hiddenModels.has(l.model)?hiddenModels.delete(l.model):hiddenModels.add(l.model);applyFilter();};
    el.appendChild(d);
  });
}
function syncLegend(){
  LEGEND.forEach(l=>{const e=document.getElementById('li-'+l.model);if(e)e.classList.toggle('off',hiddenModels.has(l.model));});
}

// ── Selectors ─────────────────────────────────────────────────
function buildSelectors(recs){
  const states=[...new Set(recs.map(r=>r[4]).filter(Boolean))].sort();
  const ss=document.getElementById('sel-s');
  states.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;ss.appendChild(o);});
  const ms=document.getElementById('sel-m');
  LEGEND.forEach(l=>{const o=document.createElement('option');o.value=l.model;o.textContent=l.model+' ('+l.count.toLocaleString()+')';ms.appendChild(o);});
}

// ── Boot ──────────────────────────────────────────────────────
(async()=>{
  map=L.map('map',{
    center:[39.5,-98.5],zoom:4,preferCanvas:true,
    zoomControl:false,  // we position it manually
    tap:true,tapTolerance:15,
  });
  L.control.zoom({position:'bottomright'}).addTo(map);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> | FAA '+DATA_DATE
  }).addTo(map);

  allRecs=await decodeData();
  buildSelectors(allRecs);
  buildLegend();
  buildMarkers(allRecs);
  applyFilter();

  const cityCount=allRecs.filter(r=>r[9]==='city'||r[9]==='country').length;
  const stateCount=allRecs.filter(r=>r[9]==='state').length;
  const total=allRecs.length;
  document.getElementById('hdr-stats').textContent=
    cityCount.toLocaleString()+' city + '+stateCount.toLocaleString()+' state-approx = '+total.toLocaleString()+' total | FAA '+DATA_DATE;

  document.getElementById('hdr').style.display='flex';
  document.getElementById('badge').style.display='block';
  document.getElementById('splash').style.display='none';

  map.on('click',()=>{if(filterOpen||legendOpen)closeAll();});
})();
</script>
</body>
</html>

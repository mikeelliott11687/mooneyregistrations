<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mooney Fleet Map — FAA Registry</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:#0d1117;color:#e6edf3}
#map{position:absolute;top:52px;left:0;right:0;bottom:0}
#hdr{position:absolute;top:0;left:0;right:0;height:52px;z-index:1000;background:linear-gradient(90deg,#161b22,#21262d);border-bottom:2px solid #c8102e;display:flex;align-items:center;gap:10px;padding:0 12px;flex-wrap:nowrap;overflow:hidden}
#hdr h1{font-size:.9em;font-weight:700;color:#fff;white-space:nowrap;flex-shrink:0}
#hdr h1 em{color:#c8102e;font-style:normal}
#hdr-stats{font-size:.67em;color:#8b949e;white-space:nowrap;flex-shrink:0}
#ctrls{display:flex;align-items:center;gap:7px;flex:1;overflow:hidden}
.cl{font-size:.67em;color:#8b949e;white-space:nowrap}
input[type=text],select{background:#0d1117;border:1px solid #30363d;color:#e6edf3;border-radius:5px;padding:3px 7px;font-size:.74em;outline:none}
input[type=text]{width:140px}
input[type=text]:focus,select:focus{border-color:#c8102e}
.btn{background:#c8102e;border:none;color:#fff;border-radius:5px;padding:4px 10px;font-size:.72em;cursor:pointer;font-weight:600;white-space:nowrap;flex-shrink:0}
.btn:hover{background:#a00d24}
.btn.sec{background:#21262d;border:1px solid #30363d}.btn.sec:hover{background:#30363d}
/* legend */
#legend{position:absolute;bottom:20px;right:8px;z-index:900;background:rgba(13,17,23,.95);border:1px solid #30363d;border-radius:8px;padding:8px 11px;max-height:62vh;overflow-y:auto;min-width:148px}
#legend h3{font-size:.65em;color:#8b949e;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.li{display:flex;align-items:center;gap:5px;margin-bottom:4px;cursor:pointer;padding:2px 3px;border-radius:3px}
.li:hover{background:rgba(200,16,46,.12)}
.li.off{opacity:.25}
.dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;border:1.5px solid rgba(255,255,255,.25)}
.ll{font-size:.72em;flex:1}
.lc{font-size:.63em;color:#8b949e}
/* badge */
#badge{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:rgba(13,17,23,.9);border:1px solid #30363d;border-radius:14px;padding:2px 12px;font-size:.7em;color:#8b949e;z-index:900;pointer-events:none;white-space:nowrap}
#badge b{color:#c8102e}
/* splash */
#splash{position:absolute;inset:0;z-index:2000;background:rgba(10,14,20,.97);display:flex;align-items:center;justify-content:center}
.sp-card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:28px 32px;max-width:420px;width:90%;text-align:center}
.sp-card h2{font-size:1.15em;color:#fff;margin-bottom:8px}
.sp-card p{font-size:.8em;color:#8b949e;line-height:1.6}
.spinner{width:40px;height:40px;border:3px solid #30363d;border-top-color:#c8102e;border-radius:50%;animation:spin .8s linear infinite;margin:16px auto 0}
@keyframes spin{to{transform:rotate(360deg)}}
/* leaflet popup */
.leaflet-popup-content-wrapper{background:#161b22!important;border:1px solid #c8102e!important;border-radius:8px!important;color:#e6edf3!important;box-shadow:0 4px 16px rgba(0,0,0,.5)!important}
.leaflet-popup-tip{background:#161b22!important}
.leaflet-popup-content{margin:10px 13px!important;min-width:190px}
.pu-n{font-size:1.05em;font-weight:700;color:#c8102e;margin-bottom:2px}
.pu-m{font-size:.8em;font-weight:600;color:#58a6ff;margin-bottom:6px}
.pu-r{font-size:.76em;color:#c9d1d9;margin:2px 0;line-height:1.4}
.pu-r b{color:#fff}
.pu-src{font-size:.63em;margin-top:6px;font-style:italic}
.pu-city{color:#2a9d8f}
.pu-state{color:#fb8500}
/* leaflet attribution tweak */
.leaflet-control-attribution{font-size:.6em}
</style>
</head>
<body>

<div id="hdr">
  <h1>&#9992;&nbsp;Mooney Fleet&nbsp;<em>FAA Registry</em></h1>
  <span id="hdr-stats"></span>
  <div id="ctrls">
    <span class="cl">Search</span>
    <input type="text" id="q" placeholder="N-number or owner..." oninput="applyFilter()">
    <span class="cl">Model</span>
    <select id="sel-m" onchange="applyFilter()"><option value="">All Models</option></select>
    <span class="cl">State</span>
    <select id="sel-s" onchange="applyFilter()"><option value="">All States</option></select>
    <button class="btn" onclick="resetAll()">Reset</button>
    <button class="btn sec" onclick="toggleLegend()">Legend</button>
  </div>
</div>

<div id="map"></div>
<div id="badge" style="display:none"><b id="vis-n">—</b> aircraft shown</div>
<div id="legend" style="display:none"><h3>Model Legend</h3><div id="leg-items"></div></div>

<div id="splash">
  <div class="sp-card">
    <h2>Loading Mooney Fleet Map</h2>
    <p>Decoding FAA registration data for<br><b style="color:#fff">6,229 aircraft</b> across 26 Mooney models</p>
    <div class="spinner"></div>
  </div>
</div>

const LEGEND = [{"model":"M20J","color":"#e63946","count":1407},{"model":"M20C","color":"#f4a261","count":1263},{"model":"M20E","color":"#2a9d8f","count":838},{"model":"M20K","color":"#457b9d","count":770},{"model":"M20F","color":"#8338ec","count":727},{"model":"M20R","color":"#06d6a0","count":402},{"model":"M20M","color":"#fb8500","count":249},{"model":"M20TN","color":"#ef233c","count":119},{"model":"M20G","color":"#3a86ff","count":117},{"model":"M20B","color":"#ffb703","count":98},{"model":"M20D","color":"#8ecae6","count":88},{"model":"M20A","color":"#a8dadc","count":59},{"model":"M20S","color":"#606c38","count":58},{"model":"M18C","color":"#bc6c25","count":52},{"model":"M10","color":"#b5838d","count":39},{"model":"M18L","color":"#6d6875","count":23},{"model":"M20","color":"#023e8a","count":23},{"model":"M20V","color":"#c77dff","count":18},{"model":"M20L","color":"#9d4edd","count":16},{"model":"M22","color":"#3d405b","count":14},{"model":"M20U","color":"#81b29a","count":13},{"model":"M18C55","color":"#f2cc8f","count":12},{"model":"M18LA","color":"#e07a5f","count":10},{"model":"A2A","color":"#3d3d3d","count":4},{"model":"M20T","color":"#264653","count":1},{"model":"M18","color":"#2d6a4f","count":1}];
const DATA_DATE = "Jul 2026";

const MODEL_COLOR = {};
LEGEND.forEach(l => MODEL_COLOR[l.model] = l.color);

let map, allRecs=[], markers=[], hiddenModels=new Set();

// ── Decompress ────────────────────────────────────────────────────────────────
async function decodeData(){
  const bin=atob(B64), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  const ds=new DecompressionStream('gzip'),w=ds.writable.getWriter(),r=ds.readable.getReader();
  w.write(arr);w.close();
  const chunks=[];while(true){const o=await r.read();if(o.done)break;chunks.push(o.value);}
  const buf=new Uint8Array(chunks.reduce((s,c)=>s+c.length,0));let off=0;
  for(const c of chunks){buf.set(c,off);off+=c.length;}
  return JSON.parse(new TextDecoder().decode(buf));
}

// ── SVG circle icon ───────────────────────────────────────────────────────────
function makeIcon(color){
  return L.divIcon({
    html:`<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13"><circle cx="6.5" cy="6.5" r="5" fill="${color}" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/></svg>`,
    className:'', iconSize:[13,13], iconAnchor:[6,6], popupAnchor:[0,-8]
  });
}

// ── Build markers ─────────────────────────────────────────────────────────────
function buildMarkers(recs){
  recs.forEach(r=>{
    const [n,m,o,city,state,zip,year,lat,lon,src]=r;
    const color = MODEL_COLOR[m]||'#888';
    const mk = L.marker([lat,lon],{icon:makeIcon(color)});

    const locStr=[city,state].filter(Boolean).join(', ')||'—';
    const srcLabel = src==='city'
      ? '<span class="pu-src pu-city">&#128205; Placed at city centroid</span>'
      : src==='state'
      ? '<span class="pu-src pu-state">&#9888; City unknown — state centroid used</span>'
      : '<span class="pu-src pu-state">&#127757; Foreign address — approximate</span>';
    const yearRow = year?`<div class="pu-r"><b>Year:</b> ${year}</div>`:'';

    mk.bindPopup(`
      <div class="pu-n">${n}</div>
      <div class="pu-m">${m}</div>
      <div class="pu-r"><b>Owner:</b> ${o||'Withheld / Unknown'}</div>
      <div class="pu-r"><b>Location:</b> ${locStr}${zip?' '+zip:''}</div>
      ${yearRow}
      ${srcLabel}
    `,{maxWidth:260});

    mk._data={n,m,o,city,state,zip,year,lat,lon,src};
    markers.push(mk);
  });
}

// ── Cluster layer ─────────────────────────────────────────────────────────────
// Use a simple layer group — Leaflet handles canvas rendering efficiently
let markerLayer;
function renderMarkers(){
  if(markerLayer) markerLayer.remove();
  markerLayer = L.layerGroup();
  let vis=0;
  markers.forEach(mk=>{
    const d=mk._data;
    const show = isVisible(d);
    if(show){markerLayer.addLayer(mk);vis++;}
  });
  markerLayer.addTo(map);
  document.getElementById('vis-n').textContent=vis.toLocaleString();
  syncLegend();
}

function isVisible(d){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const sm=document.getElementById('sel-m').value;
  const ss=document.getElementById('sel-s').value;
  return !hiddenModels.has(d.m)
    &&(!sm||d.m===sm)
    &&(!ss||d.state===ss)
    &&(!q||d.n.toLowerCase().includes(q)||d.o.toLowerCase().includes(q));
}

function applyFilter(){renderMarkers();}

function resetAll(){
  hiddenModels.clear();
  document.getElementById('q').value='';
  document.getElementById('sel-m').value='';
  document.getElementById('sel-s').value='';
  renderMarkers();
}

// ── Legend ────────────────────────────────────────────────────────────────────
function buildLegend(){
  const el=document.getElementById('leg-items');
  LEGEND.forEach(l=>{
    const d=document.createElement('div');
    d.className='li';d.id='li-'+l.model;
    d.innerHTML=`<div class="dot" style="background:${l.color}"></div><span class="ll">${l.model}</span><span class="lc">${l.count.toLocaleString()}</span>`;
    d.onclick=()=>{hiddenModels.has(l.model)?hiddenModels.delete(l.model):hiddenModels.add(l.model);renderMarkers();};
    el.appendChild(d);
  });
}
function syncLegend(){LEGEND.forEach(l=>{const e=document.getElementById('li-'+l.model);if(e)e.classList.toggle('off',hiddenModels.has(l.model));});}
function toggleLegend(){const l=document.getElementById('legend');l.style.display=l.style.display==='none'?'block':'none';}

// ── Selectors ─────────────────────────────────────────────────────────────────
function buildSelectors(recs){
  const states=[...new Set(recs.map(r=>r[4]).filter(Boolean))].sort();
  const ss=document.getElementById('sel-s');
  states.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;ss.appendChild(o);});
  const ms=document.getElementById('sel-m');
  LEGEND.forEach(l=>{const o=document.createElement('option');o.value=l.model;o.textContent=`${l.model} (${l.count.toLocaleString()})`;ms.appendChild(o);});
}

// ── Boot ──────────────────────────────────────────────────────────────────────
(async()=>{
  map=L.map('map',{center:[39.5,-98.5],zoom:4,preferCanvas:true});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:18,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> | Data: <a href="https://www.faa.gov">FAA Registry</a> '+DATA_DATE
  }).addTo(map);

  allRecs=await decodeData();
  buildSelectors(allRecs);
  buildLegend();
  buildMarkers(allRecs);
  renderMarkers();

  const total=allRecs.length;
  const cityPct=Math.round(allRecs.filter(r=>r[9]==='city').length/total*100);
  document.getElementById('hdr-stats').textContent=
    `${total.toLocaleString()} registered Mooneys | 26 models | FAA ${DATA_DATE} | ${cityPct}% city-level pins`;

  document.getElementById('badge').style.display='block';
  document.getElementById('legend').style.display='block';
  document.getElementById('splash').style.display='none';
})();
</script>
